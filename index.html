<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prato Real — PIZZA AR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
body{margin:0;background:#f7f7f5;font-family:system-ui,-apple-system,sans-serif;color:#151515}
main{max-width:520px;margin:auto;padding:18px} .top{font-weight:900;font-size:22px;margin:8px 0 18px}
model-viewer{width:100%;height:55vh;min-height:350px;background:linear-gradient(#f0ede8,#d9d4cc);border-radius:25px}
.info{padding:12px 2px} h1{margin:8px 0 3px} p{color:#666} .dims{display:flex;gap:8px}
.dim{background:#fff;border:1px solid #eee;border-radius:14px;padding:12px;flex:1;text-align:center} .dim b{display:block} .dim span{font-size:11px;color:#777}
button{width:100%;border:0;border-radius:16px;background:#111;color:white;padding:16px;font-size:16px;font-weight:900;margin-top:12px}
.note{font-size:12px;text-align:center;color:#777;line-height:1.4}
</style></head>
<body><main>
<div class="top">Prato Real</div>
<model-viewer id="mv" src="pizza.glb"
 camera-controls auto-rotate
 ar ar-modes="webxr scene-viewer quick-look"
 scale="1 1 1"
 shadow-intensity="1"
 exposure="1"
 alt="Pizza em 3D">
 <button slot="ar-button">📱 Ver tamanho real na sua mesa</button>
</model-viewer>
<h1 style="font-size: 40px; font-weight: bold;">Pizza Especial</h1>
<p>Modelo 3D configurado para aproximadamente 30 cm de largura.</p>
<div class="dims"><div class="dim"><b>30 cm</b><span>LARGURA</span></div><div class="dim"><b>5 cm</b><span>ALTURA</span></div><div class="dim"><b>~500 g</b><span>PESO</span></div></div>
<p class="note">O botão AR usa o modo compatível com o aparelho. Em aparelhos compatíveis, o modelo é colocado no ambiente pela câmera.</p>
</div></main></body></html>
