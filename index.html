<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Prato Real — Cardápio 3D</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
</script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#f7f7f5;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:#151515;
}

header{
height:70px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:24px;
font-weight:900;
letter-spacing:-1px;
}

.logo span{
font-weight:400;
}

.cart{
background:#111;
color:#fff;
border:0;
border-radius:12px;
padding:10px 15px;
font-weight:800;
}

main{
max-width:600px;
margin:auto;
padding:20px;
}

/* HERO */

.hero{
background:#111;
color:#fff;
border-radius:25px;
padding:28px 24px;
margin-bottom:28px;
}

.hero h1{
font-size:34px;
line-height:1;
margin:0 0 10px;
letter-spacing:-1.5px;
}

.hero p{
margin:0;
color:#ccc;
line-height:1.5;
}

/* CATEGORIAS */

.section-title{
font-size:22px;
margin:25px 0 15px;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:5px;
}

.category{
background:#fff;
border:1px solid #eee;
padding:13px 18px;
border-radius:15px;
font-weight:800;
white-space:nowrap;
cursor:pointer;
}

.category.active{
background:#111;
color:#fff;
}

/* PRODUTOS */

.products{
display:grid;
gap:15px;
}

.product-card{
background:#fff;
border-radius:22px;
overflow:hidden;
border:1px solid #eee;
box-shadow:0 5px 20px #00000008;
}

.product-image{
height:190px;
background:#e8e5df;
display:flex;
align-items:center;
justify-content:center;
font-size:90px;
}

.product-info{
padding:18px;
}

.product-name{
font-size:21px;
font-weight:900;
margin-bottom:5px;
}

.product-description{
font-size:14px;
color:#707070;
line-height:1.4;
margin-bottom:15px;
}

.product-bottom{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.price{
font-size:19px;
font-weight:900;
}

.view-button{
background:#111;
color:#fff;
border:0;
border-radius:13px;
padding:12px 16px;
font-weight:900;
cursor:pointer;
}

/* PRODUTO */

#productPage{
display:none;
}

.back{
border:0;
background:none;
font-size:15px;
font-weight:800;
padding:5px 0 18px;
cursor:pointer;
}

model-viewer{
width:100%;
height:430px;
background:linear-gradient(#f0ede8,#d9d4cc);
border-radius:25px;
overflow:hidden;
}

model-viewer::part(default-ar-button){
background:#8a4b4b;
color:black;
border-radius:15px;
font-weight:900;
padding:15px 20px;
}

.product-page-title{
font-size:36px;
line-height:1;
margin:20px 0 8px;
letter-spacing:-1px;
}

.product-page-description{
color:#666;
line-height:1.5;
}

.dimensions{
display:flex;
gap:8px;
margin:20px 0;
}

.dimension{
flex:1;
background:#fff;
border:1px solid #eee;
border-radius:15px;
padding:14px 8px;
text-align:center;
}

.dimension b{
display:block;
font-size:18px;
}

.dimension span{
font-size:11px;
color:#777;
font-weight:700;
}

.price-large{
font-size:25px;
font-weight:900;
margin:15px 0;
}

.order-button{
width:100%;
border:0;
background:#111;
color:#fff;
border-radius:16px;
padding:17px;
font-size:16px;
font-weight:900;
cursor:pointer;
margin-top:10px;
}

.ar-info{
background:#fff;
border:1px solid #eee;
border-radius:17px;
padding:15px;
margin-top:15px;
font-size:13px;
color:#666;
line-height:1.5;
text-align:center;
}

/* MOBILE */

@media(max-width:450px){

main{
padding:15px;
}

.hero h1{
font-size:30px;
}

.product-page-title{
font-size:31px;
}

model-viewer{
height:390px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
Prato<span>Real</span>
</div>

<button class="cart">
🛒 0
</button>

</header>


<!-- ========================= -->
<!-- CARDÁPIO -->
<!-- ========================= -->

<main id="menuPage">

<section class="hero">

<h1>
Veja antes<br>
de pedir.
</h1>

<p>
Explore nosso cardápio em 3D e veja o tamanho real dos pratos antes de fazer seu pedido.
</p>

</section>


<h2 class="section-title">
Categorias
</h2>

<div class="categories">

<button class="category active"
onclick="filterProducts('todos',this)">
Todos
</button>

<button class="category"
onclick="filterProducts('pizzas',this)">
🍕 Pizzas
</button>

<button class="category"
onclick="filterProducts('hamburgueres',this)">
🍔 Hambúrgueres
</button>

</div>


<h2 class="section-title">
Cardápio
</h2>

<div class="products" id="productsContainer"></div>

</main>



<!-- ========================= -->
<!-- PÁGINA DO PRODUTO -->
<!-- ========================= -->

<main id="productPage">

<button class="back" onclick="backToMenu()">
← Voltar ao cardápio
</button>


<model-viewer
id="modelViewer"

src=""

camera-controls
auto-rotate

ar
ar-modes="webxr scene-viewer quick-look"

shadow-intensity="1"

exposure="1"

scale="1 1 1"

alt="Modelo 3D do prato">
<button slot="ar-button" class="ar-button" style="font-size: 20px;">

📱 Ver tamanho real na minha mesa

</button>
</model-viewer>


<h1
id="productName"
class="product-page-title">
</h1>


<p
id="productDescription"
class="product-page-description">
</p>


<div class="dimensions">

<div class="dimension">

<b id="productWidth">
</b>

<span>
LARGURA
</span>

</div>


<div class="dimension">

<b id="productHeight">
</b>

<span>
ALTURA
</span>

</div>


<div class="dimension">

<b id="productWeight">
</b>

<span>
PESO
</span>

</div>

</div>


<div
id="productPrice"
class="price-large">
</div>


<button class="order-button">

🛒 Adicionar ao pedido

</button>


<div class="ar-info">

📱 <strong>Experimente em tamanho real</strong>

<br>

Toque no botão acima e a câmera do seu celular poderá colocar o prato virtualmente sobre a sua mesa.

</div>

</main>



<script>

/* =========================================
   PRODUTOS
========================================= */

const produtos = [

{
id:1,

nome:"Pizza Especial",

categoria:"pizzas",

modelo:"assets/pizza.glb",

emoji:"🍕",

descricao:
"Pizza especial com ingredientes selecionados e massa artesanal.",

preco:"R$ 39,90",

largura:"30 cm",

altura:"5 cm",

peso:"~500 g"
},


{
id:2,

nome:"Hambúrguer com Fritas",

categoria:"hamburgueres",

modelo:"assets/hamburguer-fritas.glb",

emoji:"🍔",

descricao:
"Hambúrguer artesanal acompanhado de uma porção de batatas crocantes.",

preco:"R$ 32,90",

largura:"15 cm",

altura:"10 cm",

peso:"~550 g"
}

];


/* =========================================
   MOSTRAR PRODUTOS
========================================= */

function renderProducts(lista = produtos){

const container =
document.getElementById("productsContainer");

container.innerHTML = "";


lista.forEach(produto => {

const card = document.createElement("article");

card.className = "product-card";


card.innerHTML = `

<div class="product-image">

${produto.emoji}

</div>

<div class="product-info">

<div class="product-name">

${produto.nome}

</div>

<div class="product-description">

${produto.descricao}

</div>

<div class="product-bottom">

<span class="price">

${produto.preco}

</span>

<button
class="view-button"
onclick="openProduct(${produto.id})">

Ver prato

</button>

</div>

</div>

`;

container.appendChild(card);

});

}


/* =========================================
   FILTRO
========================================= */

function filterProducts(categoria,botao){

document
.querySelectorAll(".category")
.forEach(btn=>{
btn.classList.remove("active");
});

botao.classList.add("active");


if(categoria === "todos"){

renderProducts(produtos);

}else{

renderProducts(
produtos.filter(
produto =>
produto.categoria === categoria
)
);

}

}


/* =========================================
   ABRIR PRODUTO
========================================= */

function openProduct(id){

const produto =
produtos.find(
p => p.id === id
);


document
.getElementById("menuPage")
.style.display = "none";


document
.getElementById("productPage")
.style.display = "block";


const viewer =
document.getElementById("modelViewer");


viewer.src =
produto.modelo;


viewer.alt =
produto.nome;


document
.getElementById("productName")
.textContent =
produto.nome;


document
.getElementById("productDescription")
.textContent =
produto.descricao;


document
.getElementById("productWidth")
.textContent =
produto.largura;


document
.getElementById("productHeight")
.textContent =
produto.altura;


document
.getElementById("productWeight")
.textContent =
produto.peso;


document
.getElementById("productPrice")
.textContent =
produto.preco;


window.scrollTo(0,0);

}


/* =========================================
   VOLTAR
========================================= */

function backToMenu(){

document
.getElementById("productPage")
.style.display = "none";


document
.getElementById("menuPage")
.style.display = "block";


document
.getElementById("modelViewer")
.removeAttribute("src");


window.scrollTo(0,0);

}


/* =========================================
   INICIAR
========================================= */

renderProducts();

</script>

</body>
</html>
