<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prato Real</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
</script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f5f5;
    color:#222;
}

/* =========================
   CABEÇALHO
========================= */

header{
    background:#fff;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#f97316;
}

.cart{
    background:#f97316;
    color:white;
    border:none;
    padding:11px 16px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 18px 50px;
}

/* =========================
   RESTAURANTE
========================= */

.restaurant{
    text-align:center;
    margin-bottom:25px;
}

.restaurant h1{
    font-size:32px;
    margin-bottom:7px;
}

.restaurant p{
    color:#777;
}

/* =========================
   CATEGORIAS
========================= */

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:15px;
    margin-bottom:20px;
}

.category{
    border:none;
    padding:11px 18px;
    border-radius:30px;
    background:#fff;
    color:#333;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.category.active{
    background:#f97316;
    color:white;
}

/* =========================
   PRODUTOS
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.product-card{
    background:#fff;
    border-radius:22px;
    padding:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-3px);
}

.product-image{
    height:190px;
    background:#f0ede8;
    border-radius:17px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:80px;
    margin-bottom:15px;
}

.product-info h2{
    font-size:20px;
    margin-bottom:6px;
}

.product-info p{
    color:#777;
    font-size:14px;
    line-height:1.4;
    margin-bottom:12px;
}

.price{
    font-size:21px;
    font-weight:900;
    color:#f97316;
    margin-bottom:13px;
}

.view-button{
    width:100%;
    border:none;
    background:#f97316;
    color:white;
    padding:14px;
    border-radius:13px;
    font-weight:900;
    cursor:pointer;
    font-size:15px;
}

/* =========================
   PÁGINA DO PRODUTO
========================= */

.product-page{
    display:none;
}

.back-button{
    border:none;
    background:white;
    padding:11px 16px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:18px;
}

.product-title{
    text-align:center;
    margin-bottom:15px;
}

.product-title h1{
    font-size:30px;
    margin-bottom:5px;
}

.product-title p{
    color:#777;
}

/* =========================
   MODEL VIEWER
========================= */

model-viewer{
    width:100%;
    height:430px;
    background:linear-gradient(#f0ede8,#d9d4cc);
    border-radius:25px;
    overflow:hidden;
}

/*
   BOTÃO REAL DE AR
   O !important ajuda a garantir
   a aplicação da cor no celular.
*/

.ar-button{
    background:#f97316 !important;
    color:#fff !important;
    border:none !important;
    border-radius:15px !important;
    font-weight:900 !important;
    padding:15px 20px !important;
    font-size:16px !important;
    box-shadow:0 5px 15px rgba(0,0,0,.20);
    cursor:pointer;
}

/* Caso o model-viewer utilize
   o botão padrão */

model-viewer::part(default-ar-button){
    background:#f97316 !important;
    color:white !important;
    border:none !important;
    border-radius:15px !important;
    font-weight:900 !important;
    padding:15px 20px !important;
}

/* =========================
   INFORMAÇÕES
========================= */

.details{
    background:#fff;
    margin-top:20px;
    padding:20px;
    border-radius:20px;
}

.details h2{
    margin-bottom:10px;
}

.details p{
    color:#666;
    line-height:1.5;
}

.measurements{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:18px;
}

.measure{
    background:#f7f7f7;
    padding:15px 8px;
    border-radius:13px;
    text-align:center;
}

.measure strong{
    display:block;
    color:#f97316;
    font-size:18px;
    margin-bottom:4px;
}

.measure span{
    font-size:12px;
    color:#777;
}

/* =========================
   PEDIDO
========================= */

.order-button{
    width:100%;
    margin-top:18px;
    border:none;
    background:#f97316;
    color:white;
    padding:17px;
    border-radius:15px;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:600px){

    header{
        padding:15px;
    }

    .container{
        padding:20px 14px 40px;
    }

    .restaurant h1{
        font-size:27px;
    }

    .products{
        grid-template-columns:1fr;
    }

    model-viewer{
        height:380px;
        border-radius:20px;
    }

    .measurements{
        grid-template-columns:1fr 1fr 1fr;
    }

    .measure{
        padding:13px 5px;
    }

}

</style>
</head>

<body>

<!-- =========================
     CABEÇALHO
========================= -->

<header>

    <div class="logo">
        PratoReal
    </div>

    <button class="cart">
        🛒 Carrinho
    </button>

</header>


<!-- =========================
     LISTA DE PRODUTOS
========================= -->

<div class="container" id="menuPage">

    <div class="restaurant">

        <h1>🍽️ Nosso Menu</h1>

        <p>
            Veja seu prato em tamanho real antes de pedir.
        </p>

    </div>


    <!-- CATEGORIAS -->

    <div class="categories">

        <button
        class="category active"
        onclick="filtrar('todos',this)">
            Todos
        </button>

        <button
        class="category"
        onclick="filtrar('pizzas',this)">
            🍕 Pizzas
        </button>

        <button
        class="category"
        onclick="filtrar('hamburgueres',this)">
            🍔 Hambúrgueres
        </button>

    </div>


    <!-- PRODUTOS -->

    <div
    class="products"
    id="products">
    </div>

</div>


<!-- =========================
     PÁGINA DO PRODUTO
========================= -->

<div class="container product-page" id="productPage">

    <button
    class="back-button"
    onclick="voltarMenu()">
        ← Voltar ao menu
    </button>


    <div class="product-title">

        <h1 id="productName">
            Produto
        </h1>

        <p id="productDescription">
            Descrição
        </p>

    </div>


    <!-- MODELO 3D + AR -->

    <model-viewer
        id="viewer"
        src=""
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1"
        exposure="1"
        scale="1 1 1"
        alt="Modelo 3D do prato">

        <!-- BOTÃO AR -->

        <button
        slot="ar-button"
        class="ar-button">

            📱 Ver tamanho real na minha mesa

        </button>

    </model-viewer>


    <!-- INFORMAÇÕES -->

    <div class="details">

        <h2 id="detailsTitle">
            Sobre o prato
        </h2>

        <p id="detailsDescription">
        </p>


        <div class="measurements">

            <div class="measure">

                <strong id="width">
                    --
                </strong>

                <span>
                    Largura
                </span>

            </div>


            <div class="measure">

                <strong id="height">
                    --
                </strong>

                <span>
                    Altura
                </span>

            </div>


            <div class="measure">

                <strong id="weight">
                    --
                </strong>

                <span>
                    Peso
                </span>

            </div>

        </div>


        <div
        class="price"
        id="productPrice"
        style="margin-top:20px;">
        </div>


        <button
        class="order-button"
        onclick="adicionarCarrinho()">

            🛒 Adicionar ao pedido

        </button>

    </div>

</div>


<script>

/* ==========================================
   PRODUTOS
========================================== */

const produtos = [

    {
        id:1,

        nome:"Pizza Especial",

        categoria:"pizzas",

        modelo:"assets/pizza.glb",

        emoji:"🍕",

        descricao:
        "Pizza especial com ingredientes selecionados e massa artesanal.",

        preco:"R$ 39,90",

        largura:"30 cm",

        altura:"5 cm",

        peso:"~500 g"
    },


    {
        id:2,

        nome:"Hambúrguer com Fritas",

        categoria:"hamburgueres",

        modelo:"assets/hamburguer-fritas.glb",

        emoji:"🍔",

        descricao:
        "Hambúrguer artesanal acompanhado de uma porção de batatas crocantes.",

        preco:"R$ 32,90",

        largura:"15 cm",

        altura:"10 cm",

        peso:"~550 g"
    }

];


/* ==========================================
   ELEMENTOS
========================================== */

const productsContainer =
document.getElementById("products");

const menuPage =
document.getElementById("menuPage");

const productPage =
document.getElementById("productPage");

const viewer =
document.getElementById("viewer");


/* ==========================================
   MOSTRAR PRODUTOS
========================================== */

function mostrarProdutos(lista){

    productsContainer.innerHTML = "";


    lista.forEach(produto => {

        const card =
        document.createElement("div");

        card.className =
        "product-card";


        card.innerHTML = `

            <div class="product-image">

                ${produto.emoji}

            </div>


            <div class="product-info">

                <h2>
                    ${produto.nome}
                </h2>

                <p>
                    ${produto.descricao}
                </p>

                <div class="price">
                    ${produto.preco}
                </div>

                <button
                class="view-button"
                onclick="abrirProduto(${produto.id})">

                    👀 Ver prato

                </button>

            </div>

        `;


        productsContainer.appendChild(card);

    });

}


/* ==========================================
   FILTRAR CATEGORIA
========================================== */

function filtrar(categoria, botao){

    document
    .querySelectorAll(".category")
    .forEach(btn => {

        btn.classList.remove("active");

    });


    botao.classList.add("active");


    if(categoria === "todos"){

        mostrarProdutos(produtos);

    }else{

        const filtrados =
        produtos.filter(
            produto =>
            produto.categoria === categoria
        );

        mostrarProdutos(filtrados);

    }

}


/* ==========================================
   ABRIR PRODUTO
========================================== */

function abrirProduto(id){

    const produto =
    produtos.find(
        p => p.id === id
    );


    if(!produto) return;


    document.getElementById("productName")
    .textContent =
    produto.nome;


    document.getElementById("productDescription")
    .textContent =
    produto.descricao;


    document.getElementById("detailsDescription")
    .textContent =
    produto.descricao;


    document.getElementById("productPrice")
    .textContent =
    produto.preco;


    document.getElementById("width")
    .textContent =
    produto.largura;


    document.getElementById("height")
    .textContent =
    produto.altura;


    document.getElementById("weight")
    .textContent =
    produto.peso;


    /*
       Carrega o GLB correspondente
    */

    viewer.src =
    produto.modelo;


    /*
       Esconde menu
       e abre produto
    */

    menuPage.style.display =
    "none";


    productPage.style.display =
    "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==========================================
   VOLTAR
========================================== */

function voltarMenu(){

    productPage.style.display =
    "none";


    menuPage.style.display =
    "block";


    viewer.src = "";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==========================================
   CARRINHO
========================================== */

function adicionarCarrinho(){

    alert(
        "🍽️ Produto adicionado ao carrinho!"
    );

}


/* ==========================================
   INICIALIZAÇÃO
========================================== */

mostrarProdutos(produtos);

</script>

</body>
</html>
